# Adapted from the local ~/.tmux.conf. Ctrl-A Ctrl-A selects the last window;
# Ctrl-A a sends a literal Ctrl-A to the application.
unbind C-b
set -g prefix C-a
bind C-a last-window
bind a send-prefix
set -g status on
set -g status-position bottom
set -g status-style "bg=blue,fg=#888888"
set -g status-left ""
set -g status-right "#[fg=white,bg=blue]#H"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=#ffffff,bg=blue]#I:#W"
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -s escape-time 10
bind r source-file ~/.tmux.conf
